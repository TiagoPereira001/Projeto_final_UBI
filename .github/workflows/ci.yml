name: CI

# corre em cada push para main/dev e em cada pull request.
# um PR só deve ser aceite com os dois trabalhos a verde.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (testes contra SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # as passwords são geradas na hora e nunca ficam escritas no repositório
      - name: Arrancar o SQL Server
        run: |
          SA_PASSWORD="Ci_$(openssl rand -hex 12)_Aa1!"
          APP_PASSWORD="App_$(openssl rand -hex 12)_Bb2!"
          echo "::add-mask::$SA_PASSWORD"
          echo "::add-mask::$APP_PASSWORD"
          echo "DB_ADMIN_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$APP_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" \
            -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 40); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server pronto"; exit 0
            fi
            sleep 3
          done
          docker logs sql
          exit 1

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
