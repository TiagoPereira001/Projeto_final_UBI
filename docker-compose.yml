# Bancada: ambiente com Docker
#
# desenvolvimento (só a base de dados; a API e o frontend correm com npm):
#   docker compose up -d
#
# tudo em containers (base de dados + API a servir o frontend já compilado):
#   docker compose --profile app up -d --build
#   -> http://localhost:3000
#
# as passwords vêm do .env na raiz (ver .env.example). Nunca escrever aqui.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # necessário em Macs Apple Silicon: o SQL Server não tem imagem nativa ARM
    container_name: bancada_sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_ADMIN_PASSWORD:?Define DB_ADMIN_PASSWORD no .env (ver .env.example)}
    ports:
      # só acessível a partir deste computador. Com "1433:1433" o SQL Server
      # ficava aberto a toda a rede (Wi-Fi da faculdade, do café...), e o Docker
      # contorna a firewall do sistema
      - "127.0.0.1:1433:1433"
    volumes:
      - sql_dados:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    profiles: ["app"]
    build: .
    container_name: bancada_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET no .env}
      # em http://localhost as cookies não podem ser "Secure"; atrás de HTTPS, apagar esta linha
      COOKIE_SECURE: "false"
      APP_ORIGINS: http://localhost:3000
    # prepara a base de dados (não mexe no que já existe) e arranca a API
    command: ["sh", "-c", "node backend/scripts/db-setup.js && node backend/server.js"]
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  sql_dados:
